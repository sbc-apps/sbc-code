name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Package VSIX
        run: npm run package
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: sbc-code-vsix
          path: "*.vsix"
          if-no-files-found: error
